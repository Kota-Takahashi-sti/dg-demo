# データガバナンス OSS デモ環境
# profile で領域ごとに起動・停止する(全製品の同時起動はしない)。
#   base    : デモ用データ DB(全デモの前提)
#   tools   : ツール実行用 CLI コンテナ(常駐せず `docker compose run` で都度実行)
#   lineage : Marquez 一式(フェーズ2で追加)
#   catalog : OpenMetadata 一式(フェーズ3で追加)
#   contract: datacontract-cli 公式イメージ(常駐せず `run` で都度実行。フェーズ4で追加)
#
# ---------------------------------------------------------------------------
# 帰属表示(Apache License 2.0 §4)
#
# 本ファイルの catalog profile(x-om-env / om-postgresql / om-elasticsearch /
# om-migrate / om-server)は、OpenMetadata 公式リリースアセット
# docker-compose-postgres.yml (1.13.3-release) を基にした派生物です。
#
#   Copyright 2021 Collate
#   Licensed under the Apache License, Version 2.0
#   http://www.apache.org/licenses/LICENSE-2.0
#
# 原典からの主な変更点(Apache-2.0 §4(b) の変更告知):
#   - Airflow ingestion コンテナ(openmetadata_ingestion)を削除し、
#     PIPELINE_SERVICE_CLIENT_ENABLED を false に変更(取り込みは tools から CLI 実行)
#   - サービス名を本 compose の命名(om-*)に変更し、接続先ホスト名を追随
#   - 内部 DB / Elasticsearch のホストへのポート公開を削除(衝突回避)
#   - om-server の healthcheck に interval / retries / start_period を追加
#   - profiles / volumes を本デモの構成に合わせて再定義
# 変更の判断理由は docs/build-log.md「設計判断: catalog profile の compose 構成」を参照。
#
# 本ファイルのうち上記以外の部分(base / tools / lineage / contract profile)は
# 本リポジトリの自作物で、リポジトリの LICENSE(Apache-2.0)に従います。
# ---------------------------------------------------------------------------
# OpenMetadata の migrate ワンショットと server で共通の設定値。
# 値は公式リリースアセット docker-compose-postgres.yml(1.13.3-release)の既定値に
# 合わせ、ホスト名のみ本 compose のサービス名に置換(build-log.md 参照)。
# DB ユーザー等は om-postgresql イメージの initdb が作成する固定値(デモ専用)。
x-om-env: &om-env
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  DB_USER: openmetadata_user
  DB_USER_PASSWORD: openmetadata_password
  DB_HOST: om-postgresql
  DB_PORT: 5432
  OM_DATABASE: openmetadata_db
  SEARCH_TYPE: elasticsearch
  ELASTICSEARCH_HOST: om-elasticsearch
  ELASTICSEARCH_PORT: 9200
  ELASTICSEARCH_SCHEME: http
  AUTHENTICATION_PROVIDER: basic
  AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
  # Airflow ingestion コンテナは不採用(plan.md §3.4)のため無効化(公式既定は true)
  PIPELINE_SERVICE_CLIENT_ENABLED: "false"
  OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G

services:
  postgres-demo:
    image: postgres:16
    profiles: ["base"]
    environment:
      POSTGRES_USER: ${DEMO_DB_USER:-demo}
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo_password}
      POSTGRES_DB: ${DEMO_DB_NAME:-demo}
    ports:
      - "${DEMO_DB_HOST_PORT:-15432}:5432"
    volumes:
      - demo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEMO_DB_USER:-demo} -d ${DEMO_DB_NAME:-demo}"]
      interval: 2s
      timeout: 3s
      retries: 30

  tools:
    build:
      context: docker/tools
    image: dgd-tools:phase3
    profiles: ["tools"]
    environment:
      DEMO_DB_HOST: ${DEMO_DB_HOST:-postgres-demo}
      DEMO_DB_PORT: ${DEMO_DB_PORT:-5432}
      DEMO_DB_USER: ${DEMO_DB_USER:-demo}
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:-demo_password}
      DEMO_DB_NAME: ${DEMO_DB_NAME:-demo}
      # openlineage-python の設定ファイル(HTTP transport → marquez-api)
      OPENLINEAGE_CONFIG: /workspace/lineage/openlineage.yml
      # パイプ実行時も stdout/stderr の出力順序をログで正しく保つ
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./:/workspace
    working_dir: /workspace

  # --- contract profile: datacontract-cli(plan.md §3.4、フェーズ4)---
  # 公式イメージをそのまま使う(自前ビルド不要)。常駐せず `run --rm` で都度実行。
  # 1.1.0 のイメージはシェルレス(distroless 化)だが、CLI 実行のみのため影響なし
  # (バージョン判断は build-log.md 参照)。
  datacontract:
    image: datacontract/cli:1.1.0
    profiles: ["contract"]
    # イメージ既定の実行ユーザーは nonroot(uid 65532)で、マウントした
    # リポジトリ(verification/ 等)へ書き込めないため、ホスト側ユーザーに合わせる。
    # ホストの `id -u` が 1000 以外の場合は .env の DC_UID / DC_GID を変更する。
    user: "${DC_UID:-1000}:${DC_GID:-1000}"
    # rootless Podman でもホスト UID とコンテナ UID を対応させ、
    # bind mount した verification/ へ生成物を書き込めるようにする。
    userns_mode: keep-id
    environment:
      # 任意 uid 実行でもホームディレクトリ書き込みが失敗しないようにする
      HOME: /tmp
      # postgres 接続の資格情報は契約 YAML に書かず環境変数で渡す(公式仕様)
      DATACONTRACT_POSTGRES_USERNAME: ${DEMO_DB_USER:-demo}
      DATACONTRACT_POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-demo_password}
    volumes:
      - ./:/workspace
    working_dir: /workspace

  # --- lineage profile: Marquez 一式(plan.md §3.4)---
  # Marquez のイメージは amd64 のみ提供(plan.md R2)。platform を明示し、
  # Apple Silicon ではエミュレーションで動作する(既知の制約)。
  marquez-db:
    image: postgres:14
    platform: linux/amd64
    profiles: ["lineage"]
    environment:
      # marquez.dev.yml(API コンテナの既定設定)が DB 名/ユーザー/パスワード
      # `marquez` を前提とするため固定(デモ専用値。build-log.md 参照)
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 2s
      timeout: 3s
      retries: 30

  marquez-api:
    image: marquezproject/marquez:0.51.1
    platform: linux/amd64
    profiles: ["lineage"]
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      # OpenSearch 連携(0.51 で既定 true)はデモに不要のため無効化
      SEARCH_ENABLED: "false"
    ports:
      - "${MARQUEZ_API_HOST_PORT:-5000}:5000"
      - "${MARQUEZ_ADMIN_HOST_PORT:-5001}:5001"
    depends_on:
      marquez-db:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    platform: linux/amd64
    profiles: ["lineage"]
    environment:
      # Web は API をサーバ側でプロキシするため、コンテナ名で到達できればよい
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: 5000
      WEB_PORT: 3000
      REACT_APP_ADVANCED_SEARCH: "false"
    ports:
      - "${MARQUEZ_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - marquez-api

  # --- catalog profile: OpenMetadata 一式(plan.md §3.4、フェーズ3)---
  # 構成は公式リリースアセット docker-compose-postgres.yml(1.13.3-release)準拠。
  # Airflow ingestion コンテナは不採用(取り込みは tools から metadata CLI で実行)。
  # OM 内部の DB・Elasticsearch はホストへポート公開しない(衝突回避。デモで直接触らない)。
  om-postgresql:
    image: docker.io/openmetadata/postgresql:1.13.3
    profiles: ["catalog"]
    command: "--work_mem=10MB"
    environment:
      # イメージ同梱の initdb が openmetadata_db と openmetadata_user を作成する
      # (固定値・デモ専用。公式 compose の既定値そのまま)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - om-db-data:/var/lib/postgresql/data
    healthcheck:
      test: psql -U postgres -tAc 'select 1' -d openmetadata_db
      interval: 15s
      timeout: 10s
      retries: 10

  om-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    profiles: ["catalog"]
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - xpack.security.enabled=false
    volumes:
      - om-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10

  # スキーマ移行のワンショット(完了後に om-server が起動する。公式構成どおり)
  om-migrate:
    image: docker.io/openmetadata/server:1.13.3
    profiles: ["catalog"]
    command: "./bootstrap/openmetadata-ops.sh migrate"
    environment:
      <<: *om-env
      MIGRATION_LIMIT_PARAM: 1200
    depends_on:
      om-postgresql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy

  om-server:
    image: docker.io/openmetadata/server:1.13.3
    profiles: ["catalog"]
    restart: always
    environment:
      <<: *om-env
    ports:
      - "${OM_SERVER_HOST_PORT:-8585}:8585"
      - "${OM_ADMIN_HOST_PORT:-8586}:8586"
    depends_on:
      om-postgresql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy
      om-migrate:
        condition: service_completed_successfully
    healthcheck:
      # test は公式 compose のまま。公式は interval 等未指定(Docker 既定 30s×3回)だが、
      # 初回起動が遅くても `up --wait` が失敗しないよう回数と start_period を延長
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s

volumes:
  demo-db-data:
  marquez-db-data:
  om-db-data:
  om-es-data:
